<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doubloon — Chat</title>
<style>
  :root {
    --bg: #0d1321; --panel: #161d2f; --line: #263047;
    --ink: #e8e6df; --muted: #9aa3b5; --gold: #d9a441;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.6 Georgia, serif;
         display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center;
           padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .logo { font-weight: bold; } .logo span { color: var(--gold); }
  .meta { color: var(--muted); font-size: 13px; }
  .meta a { color: var(--gold); text-decoration: none; }
  #log { flex: 1; overflow-y: auto; padding: 24px 0; }
  .msg { max-width: 760px; margin: 0 auto 18px; padding: 0 20px; display: flex; gap: 12px; }
  .who { flex: 0 0 28px; height: 28px; border-radius: 50%; text-align: center; line-height: 28px;
         font-size: 14px; background: var(--panel); border: 1px solid var(--line); }
  .msg.user .who { background: var(--gold); color: #0d1321; }
  .body { flex: 1; white-space: pre-wrap; word-wrap: break-word; padding-top: 2px; }
  .body code { background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
               padding: 1px 5px; font: 13px/1.5 ui-monospace, monospace; }
  .body pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
              padding: 12px; overflow-x: auto; margin: 8px 0; }
  .body pre code { background: none; border: none; padding: 0; }
  .sys { text-align: center; color: var(--muted); font-size: 13px; margin: 12px 0; }
  .sys a { color: var(--gold); }
  form { border-top: 1px solid var(--line); padding: 14px 20px 18px; }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; background: var(--panel); border: 1px solid var(--line);
             border-radius: 10px; color: var(--ink); font: inherit; padding: 11px 14px; height: 52px; }
  textarea:focus { outline: none; border-color: var(--gold); }
  button { background: var(--gold); border: none; border-radius: 10px; color: #0d1321;
           font: bold 15px Georgia, serif; padding: 0 22px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="logo">⚓ Dou<span>bloon</span></div>
  <div class="meta"><span id="quota"></span> · <a href="/">pricing</a></div>
</header>

<div id="log">
  <div class="sys">Ahoy. Ask anything — answers stream in live. History lives in this tab only.</div>
</div>

<form id="form">
  <div class="row">
    <textarea id="input" placeholder="Message Doubloon…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>

<script>
  const log = document.getElementById('log');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const quotaEl = document.getElementById('quota');
  const history = [];
  let paymentLink = '';

  fetch('/api/config').then(r => r.json()).then(cfg => {
    paymentLink = cfg.paymentLink;
    quotaEl.textContent = cfg.demoMode ? 'demo mode' : cfg.model;
  }).catch(() => {});

  // Minimal, safe rendering: escape everything, then re-introduce code blocks,
  // inline code, and bold. Good enough for an MVP without a markdown dep.
  function render(el, text) {
    let h = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, l, c) => '<pre><code>' + c + '</code></pre>');
    h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    el.innerHTML = h;
  }

  function addMsg(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? '☠' : '⚓';
    const body = document.createElement('div');
    body.className = 'body';
    render(body, text);
    wrap.append(who, body);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return body;
  }

  function addSys(html) {
    const d = document.createElement('div');
    d.className = 'sys';
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  async function chat(text) {
    history.push({ role: 'user', content: text });
    addMsg('user', text);
    const body = addMsg('assistant', '…');
    send.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      if (res.status === 429) {
        const err = await res.json();
        history.pop();
        body.parentElement.remove();
        addSys('Daily free limit reached. ' + (err.paymentLink || paymentLink
          ? '<a href="' + (err.paymentLink || paymentLink) + '">Upgrade to Pro →</a>'
          : 'Set STRIPE_PAYMENT_LINK to enable upgrades.'));
        return;
      }
      if (!res.ok || !res.body) {
        history.pop();
        render(body, '**Error** — request failed (' + res.status + ').');
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '', answer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const ev = JSON.parse(part.slice(6));
          if (ev.type === 'text') {
            answer += ev.text;
            render(body, answer);
            log.scrollTop = log.scrollHeight;
          } else if (ev.type === 'done') {
            if (typeof ev.remaining === 'number') {
              quotaEl.textContent = ev.remaining + ' free msgs left today';
            }
          } else if (ev.type === 'error') {
            answer += '\n\n**' + ev.message + '**';
            render(body, answer);
          }
        }
      }
      history.push({ role: 'assistant', content: answer });
    } catch (e) {
      history.pop();
      render(body, '**Network error** — check your connection and retry.');
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = '';
    chat(text);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
</script>
</body>
</html>
