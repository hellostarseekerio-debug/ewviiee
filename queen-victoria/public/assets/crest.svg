<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Queen Victoria crest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D49B"/>
      <stop offset="1" stop-color="#C2A04C"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#g)" stroke-width="1.6">
    <!-- shield -->
    <path d="M50 8 C68 14 80 14 86 12 C86 40 82 66 50 92 C18 66 14 40 14 12 C20 14 32 14 50 8 Z"/>
    <path d="M50 14 C65 19 75 19 80 17 C80 40 77 62 50 84 C23 62 20 40 20 17 C25 19 35 19 50 14 Z" stroke-width="0.8" opacity="0.7"/>
  </g>
  <!-- crown -->
  <g fill="url(#g)">
    <path d="M34 30 L38 22 L44 28 L50 20 L56 28 L62 22 L66 30 L64 36 L36 36 Z"/>
    <circle cx="38" cy="21" r="1.8"/><circle cx="50" cy="19" r="1.8"/><circle cx="62" cy="21" r="1.8"/>
  </g>
  <!-- monogram QV -->
  <text x="50" y="62" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="26" font-weight="700" fill="url(#g)">QV</text>
  <!-- banner -->
  <path d="M28 70 L72 70 L66 78 L34 78 Z" fill="url(#g)" opacity="0.92"/>
  <text x="50" y="76.4" text-anchor="middle" font-family="Jost, sans-serif" font-size="5" letter-spacing="1" fill="#0A211B" font-weight="600">EST. 2009</text>
</svg>
