# Netlify configuration for The Queen Victoria.
# Static front end is served from public/; the entire /api/* surface is handled
# by a single streaming Function backed by Netlify Blobs.

[build]
  base = "queen-victoria"
  publish = "public"
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The v2 function declares its own route (`/api/*`) via config.path, so no
# explicit redirect is needed. SPA-style fallbacks are unnecessary (multi-page
# static site). Netlify serves 404.html automatically for unknown paths.

# --- Security headers (mirrors the local Helmet CSP) ---
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com; connect-src 'self'; frame-src 'self' https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"

# Long-cache fingerprintable static assets.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
