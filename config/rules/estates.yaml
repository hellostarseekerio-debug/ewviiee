# Housing estate definitions, each linked to a district id from districts.yaml.
# Add new estates here - no code change required.
#
# `common_routes` / `politicians` / `dropbox_folder` / `poster_templates`
# are the "estate metadata" fields from app/posters/estates.py's
# EstateMetadataService - deliberately left empty below for every estate.
# This file has no authoritative source for which politicians/bus routes/
# Dropbox folders/templates are actually associated with a given estate,
# so populating them here would mean presenting a guess as fact in a
# system used for real government office work. Office staff should fill
# these in per-estate as that information is confirmed; the parser and
# EstateMetadataService already read them the moment they're non-empty,
# no code change required.
