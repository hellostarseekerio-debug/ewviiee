[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-automation-platform"
version = "0.1.0"
description = "Enterprise AI Office Automation Platform for Hong Kong Legislative Council offices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "PySide6>=6.7",
    "pypdf>=4.2",
    "pikepdf>=8.15",
    "reportlab>=4.2",
    "Pillow>=10.3",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "tenacity>=8.3",
    "cryptography>=42.0",
    "watchdog>=4.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "passlib[bcrypt]>=1.7",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3",
    "slowapi>=0.1.9",
    "pyotp>=2.9",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7", "paddlepaddle>=2.6", "pytesseract>=0.3.10"]
postgres = ["psycopg2-binary>=2.9"]
ai-openai = ["openai>=1.30"]
ai-anthropic = ["anthropic>=0.28"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.4",
]

[project.scripts]
office-automation-api = "app.api.main:run"
office-automation-gui = "app.gui.main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
